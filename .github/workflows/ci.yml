name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: .cargo-target

jobs:
  format:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace

  clippy:
    name: Clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-lib:
    name: "Tests: lib + doc"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p afs-as --lib
      - run: cargo test -p afs-as --doc

  test-clang-dashboard:
    name: "Tests: clang probe dashboard"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p afs-as --test clang_probe_dashboard

  test-integration:
    name: "Tests: integration suite"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run every integration test except the clang probe dashboard
        run: |
          set -euo pipefail
          shopt -s nullglob
          for test_path in tests/*.rs; do
            test_name="$(basename "${test_path}" .rs)"
            if [ "${test_name}" = "clang_probe_dashboard" ]; then
              continue
            fi
            echo "::group::cargo test --test ${test_name}"
            cargo test -p afs-as --test "${test_name}"
            echo "::endgroup::"
          done

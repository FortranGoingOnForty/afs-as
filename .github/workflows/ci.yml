name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build
        run: cargo build --workspace

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests (validate against system as)
        run: cargo test --test verify_against_system_as

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
